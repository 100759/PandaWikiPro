# PandaWiki 已解锁部署（在原官方 compose 基础上，仅把 api 容器换成打过补丁的二进制）
services:
  caddy:
    container_name: panda-wiki-caddy
    restart: always
    image: chaitin-registry.cn-hangzhou.cr.aliyuncs.com/chaitin/panda-wiki-caddy:2.10-alpine
    cap_add: [NET_ADMIN]
    volumes:
      - ./data/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_run:/run/caddy
      - caddy_data:/data
    environment:
      - CADDY_ADMIN=unix//run/caddy/caddy-admin.sock
    networks:
      panda-wiki:
        ipv4_address: "${SUBNET_PREFIX:-169.254.15}.5"
  nginx:
    container_name: panda-wiki-nginx
    depends_on: [api, sidecar]
    restart: always
    image: chaitin-registry.cn-hangzhou.cr.aliyuncs.com/chaitin/panda-wiki-nginx:v3.87.5
    ports:
      - ${ADMIN_PORT:-2443}:8080
    volumes:
      - ./admin-dist:/opt/frontend/dist:ro
      - ./nginx/server.conf:/etc/nginx/conf.d/server.conf:ro
      - ./data/nginx/ssl:/etc/nginx/ssl
    networks:
      panda-wiki:
        ipv4_address: "${SUBNET_PREFIX:-169.254.15}.111"
  app:
    container_name: panda-wiki-app
    restart: always
    image: chaitin-registry.cn-hangzhou.cr.aliyuncs.com/chaitin/panda-wiki-app:v3.87.5
    networks:
      panda-wiki:
        ipv4_address: "${SUBNET_PREFIX:-169.254.15}.112"
  api:
    container_name: panda-wiki-api
    depends_on: [postgres, nats, caddy, raglite]
    restart: always
    image: chaitin-registry.cn-hangzhou.cr.aliyuncs.com/chaitin/panda-wiki-api:v3.87.5
    volumes:
      - ./panda-wiki-api.patched:/app/panda-wiki-api:ro
      - caddy_run:/run/caddy
      - ./data/nginx/ssl:/app/etc/nginx/ssl
      - ./data/conf/api:/data
    environment:
      - NATS_PASSWORD=${NATS_PASSWORD}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - S3_SECRET_KEY=${S3_SECRET_KEY}
      - JWT_SECRET=${JWT_SECRET}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      - SUBNET_PREFIX=${SUBNET_PREFIX}
      - CADDY_API=/run/caddy/caddy-admin.sock
    networks:
      panda-wiki:
        ipv4_address: "${SUBNET_PREFIX:-169.254.15}.2"
  sidecar:
    container_name: panda-wiki-sidecar
    build:
      context: ./sidecar
    restart: always
    depends_on: [postgres]
    environment:
      - PORT=8099
      - JWT_SECRET=${JWT_SECRET}
      - DATABASE_URL=postgres://panda-wiki:${POSTGRES_PASSWORD}@panda-wiki-postgres:5432/panda-wiki
      - GITHUB_REPO=${GITHUB_REPO:-chaitin/PandaWiki}
      - GITHUB_TOKEN=${GITHUB_TOKEN:-}
      - SELF_VERSION=${SELF_VERSION:-v3.87.5}
    networks:
      panda-wiki:
        ipv4_address: "${SUBNET_PREFIX:-169.254.15}.6"
  consumer:
    container_name: panda-wiki-consumer
    depends_on: [nats, api, raglite]
    restart: always
    image: chaitin-registry.cn-hangzhou.cr.aliyuncs.com/chaitin/panda-wiki-consumer:v3.87.5
    environment:
      - NATS_PASSWORD=${NATS_PASSWORD}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - S3_SECRET_KEY=${S3_SECRET_KEY}
      - JWT_SECRET=${JWT_SECRET}
      - SUBNET_PREFIX=${SUBNET_PREFIX}
    networks:
      panda-wiki:
        ipv4_address: "${SUBNET_PREFIX:-169.254.15}.3"
  postgres:
    container_name: panda-wiki-postgres
    image: chaitin-registry.cn-hangzhou.cr.aliyuncs.com/chaitin/postgres-zhparser:17.6-bookworm
    restart: always
    environment:
      - POSTGRES_USER=panda-wiki
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=panda-wiki
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    networks:
      panda-wiki:
        ipv4_address: "${SUBNET_PREFIX:-169.254.15}.10"
  redis:
    container_name: panda-wiki-redis
    restart: always
    image: chaitin-registry.cn-hangzhou.cr.aliyuncs.com/chaitin/panda-wiki-redis:7.4.2-alpine
    command: ["redis-server","--requirepass","${REDIS_PASSWORD}","--appendonly","yes"]
    volumes:
      - ./data/redis:/data
    networks:
      panda-wiki:
        ipv4_address: "${SUBNET_PREFIX:-169.254.15}.11"
  minio:
    container_name: panda-wiki-minio
    restart: always
    image: chaitin-registry.cn-hangzhou.cr.aliyuncs.com/chaitin/panda-wiki-minio:RELEASE.2025-04-22T22-12-26Z-cpuv1
    command: ["minio","server","/data","--console-address",":9001"]
    volumes:
      - ./data/minio:/data
    environment:
      - MINIO_ACCESS_KEY=s3panda-wiki
      - MINIO_SECRET_KEY=${S3_SECRET_KEY}
    networks:
      panda-wiki:
        ipv4_address: "${SUBNET_PREFIX:-169.254.15}.12"
  nats:
    container_name: panda-wiki-nats
    restart: always
    image: chaitin-registry.cn-hangzhou.cr.aliyuncs.com/chaitin/panda-wiki-nats:2.11.3-alpine
    command: ["nats-server","-js","--store_dir","/data","--user","panda-wiki","--pass","${NATS_PASSWORD}"]
    volumes:
      - ./data/nats:/data
    networks:
      panda-wiki:
        ipv4_address: "${SUBNET_PREFIX:-169.254.15}.13"
  qdrant:
    container_name: panda-wiki-qdrant
    restart: always
    image: chaitin-registry.cn-hangzhou.cr.aliyuncs.com/chaitin/panda-wiki-qdrant:v1.14.1
    volumes:
      - ./data/qdrant:/qdrant/storage
    environment:
      - QDRANT__SERVICE__API_KEY=${QDRANT_API_KEY}
    networks:
      panda-wiki:
        ipv4_address: "${SUBNET_PREFIX:-169.254.15}.14"
  crawler:
    container_name: panda-wiki-crawler
    restart: always
    init: true
    image: chaitin-registry.cn-hangzhou.cr.aliyuncs.com/chaitin/anydoc:v0.10.2
    environment:
      - GLOG_GLOBAL_LEVEL=info
      - NAMESPACE=anydoc
      - MQ_NATS_URL=nats://panda-wiki-nats:4222
      - MQ_NATS_USER=panda-wiki
      - MQ_NATS_PASSWORD=${NATS_PASSWORD}
      - OSS_MINIO_ACCESS_KEY=s3panda-wiki
      - OSS_MINIO_SECRET_KEY=${S3_SECRET_KEY}
      - OSS_MINIO_ENDPOINT=panda-wiki-minio:9000
    networks:
      panda-wiki:
        ipv4_address: "${SUBNET_PREFIX:-169.254.15}.17"
  raglite:
    container_name: panda-wiki-raglite
    restart: always
    image: chaitin-registry.cn-hangzhou.cr.aliyuncs.com/chaitin/raglite:v2.17.0
    volumes:
      - ./data/raglite:/data
    environment:
      - GIN_MODE=release
      - DATABASE_POSTGRESQL_HOST=panda-wiki-postgres
      - DATABASE_POSTGRESQL_USER=panda-wiki
      - DATABASE_POSTGRESQL_PASSWORD=${POSTGRES_PASSWORD}
      - DATABASE_QDRANT_HOST=panda-wiki-qdrant
      - DATABASE_QDRANT_API_KEY=${QDRANT_API_KEY}
      - STORAGE_MINIO_ENDPOINT=panda-wiki-minio:9000
      - STORAGE_MINIO_ACCESS_KEY_ID=s3panda-wiki
      - STORAGE_MINIO_SECRET_ACCESS_KEY=${S3_SECRET_KEY}
      - NATS_URL=nats://panda-wiki-nats:4222
      - NATS_USER=panda-wiki
      - NATS_PASSWORD=${NATS_PASSWORD}
      - EMBEDDER_RPM=800
      - LLM_RPM=50
    depends_on: [postgres, minio, qdrant]
    networks:
      panda-wiki:
        ipv4_address: "${SUBNET_PREFIX:-169.254.15}.18"

volumes:
  caddy_run:
  caddy_data:

networks:
  panda-wiki:
    ipam:
      driver: default
      config:
        - subnet: "${SUBNET_PREFIX:-169.254.15}.0/24"
